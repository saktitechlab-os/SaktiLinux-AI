<?xml version="1.0" encoding="UTF-8"?>
<!-- SaktiLinux AI — Default wallpaper (deep space + aurora + core) -->
<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1240"/>
      <stop offset="0.55" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#060a18"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#818cf8" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#c084fc" stop-opacity="0.45"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.45">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurAurora" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="140"/>
    </filter>
  </defs>

  <rect width="3840" height="2160" fill="url(#bg)"/>

  <!-- aurora bands -->
  <path d="M0 1500 Q 640 1150 1280 1400 T 2560 1250 T 3840 1450 L 3840 2160 L 0 2160 Z"
        fill="url(#aurora)" filter="url(#blurAurora)" opacity="0.5"/>
  <path d="M0 1750 Q 900 1450 1700 1650 T 3840 1550 L 3840 2160 L 0 2160 Z"
        fill="#c084fc" filter="url(#blurAurora)" opacity="0.22"/>

  <!-- orbit ring (brand) -->
  <g transform="translate(1920 760)">
    <circle r="210" fill="none" stroke="#22d3ee" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="8 18"/>
    <circle r="210" fill="none" stroke="#c084fc" stroke-opacity="0.18" stroke-width="1.5"/>
    <circle r="70" fill="url(#glow)"/>
    <circle r="70" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
    <circle r="44" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="3" stroke-dasharray="55 30" stroke-linecap="round" transform="rotate(-45)"/>
    <circle r="18" fill="#ffffff" fill-opacity="0.92"/>
    <circle r="6" fill="#0f172a"/>
  </g>

  <!-- subtle stars -->
  <g fill="#ffffff" fill-opacity="0.35">
    <circle cx="320" cy="420" r="2"/><circle cx="740" cy="250" r="1.5"/>
    <circle cx="1280" cy="180" r="2.2"/><circle cx="1760" cy="330" r="1.6"/>
    <circle cx="2210" cy="120" r="2"/><circle cx="2720" cy="260" r="1.5"/>
    <circle cx="3180" cy="140" r="2.2"/><circle cx="3510" cy="380" r="1.6"/>
    <circle cx="400" cy="860" r="1.4"/><circle cx="3450" cy="920" r="1.8"/>
    <circle cx="1550" cy="620" r="1.2"/><circle cx="2350" cy="560" r="1.6"/>
  </g>
</svg>